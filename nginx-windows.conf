worker_processes 1;

events {
  worker_connections 1024;
}

http {
  default_type application/octet-stream;

  # --- High-Performance Native Gzip Compression ---
  # Level 1 saves CPU significantly on Windows while retaining ~70-80% bandwidth compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 1;
  gzip_min_length 1024;
  gzip_types
    application/json
    application/javascript
    text/plain
    text/css
    text/xml
    application/xml
    text/javascript;

  # --- Edge Micro-Caching Storage ---
  # Shared memory keys_zone (10MB holds ~80,000 keys) and disk storage up to 1GB
  proxy_cache_path E:/Projects/System-Design/Book-my-show/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;
  proxy_cache_key "$scheme$request_method$host$request_uri";

  # Upstream backend with persistent keepalive socket pool
  upstream backend {
    server 127.0.0.1:3000;
    keepalive 64;
  }

  server {
    listen 8080 backlog=4096;
    server_name localhost;

    # Persistent client keepalive (prevents Nginx from disconnecting client after 1,000 requests)
    keepalive_timeout 65;
    keepalive_requests 100000;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;

      # CRITICAL FOR HIGH CONCURRENCY: Enable persistent upstream Keep-Alive
      # (Clearing the Connection header prevents Nginx from closing sockets on every request)
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Buffering optimizations
      proxy_buffering on;
      proxy_buffers 16 16k;
      proxy_buffer_size 16k;

      # --- Edge Micro-Caching Engine ---
      proxy_cache api_cache;
      proxy_cache_valid 200 60s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;
      proxy_cache_methods GET HEAD;

      # Expose cache status header (HIT / MISS / BYPASS)
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
