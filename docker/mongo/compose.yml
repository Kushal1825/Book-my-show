services:
  mongo:
    image: mongo:7.0
    container_name: bms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: book_my_show
    volumes:
      - mongo_data:/data/db
      - ./mongod.conf:/etc/mongo/mongod.conf:ro
    command: ["--config", "/etc/mongo/mongod.conf"]

volumes:
  mongo_data:
